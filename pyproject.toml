[project]
name = "trex"
version = "0.1.0"
description = "Double DQN for the Chrome T-Rex Runner game"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "playwright>=1.65.2",
    "torch==2.15.0+cpu",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
